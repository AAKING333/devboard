{% extends "base.html" %}

{% block title %}
Edit Note | DevBoard
{% endblock %}

{% block content %}

<section class="form-container">

    <div class="page-header">
        <div>
            <h2>Edit Note</h2>
            <p>Update your saved development note.</p>
        </div>
    </div>

    <form method="POST" class="note-form">

        <div class="form-group">
            <label for="title">Title</label>

            <input
                type="text"
                id="title"
                name="title"
                value="{{ note['title'] }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="category">Category</label>

            <input
                type="text"
                id="category"
                name="category"
                value="{{ note['category'] or '' }}"
            >
        </div>

        <div class="form-group">
            <label for="content">Content</label>

            <textarea
                id="content"
                name="content"
                rows="10"
                required
            >{{ note["content"] }}</textarea>
        </div>

        <button type="submit" class="button">
            Save Changes
        </button>

    </form>

</section>

{% endblock %}

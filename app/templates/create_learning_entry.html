{% extends "base.html" %}

{% block title %}
New Learning Entry | DevBoard
{% endblock %}

{% block content %}

<section class="form-container">

    <div class="page-header">
        <div>
            <h2>New Learning Entry</h2>
            <p>Add a topic or skill you are learning.</p>
        </div>
    </div>

    <form method="POST" class="learning-form">

        <div class="form-group">
            <label for="topic">Topic</label>

            <input
                type="text"
                id="topic"
                name="topic"
                placeholder="e.g. Flask Blueprints"
                required
            >
        </div>

        <div class="form-group">
            <label for="category">Category</label>

            <input
                type="text"
                id="category"
                name="category"
                placeholder="e.g. Backend Development"
            >
        </div>

        <div class="form-group">
            <label for="progress">Progress (%)</label>

            <input
                type="number"
                id="progress"
                name="progress"
                min="0"
                max="100"
                value="0"
                required
            >
        </div>

        <div class="form-group">
            <label for="status">Status</label>

            <select id="status" name="status">

                <option value="not_started">
                    Not Started
                </option>

                <option value="in_progress">
                    In Progress
                </option>

                <option value="completed">
                    Completed
                </option>

            </select>
        </div>

        <div class="form-group">
            <label for="notes">Notes</label>

            <textarea
                id="notes"
                name="notes"
                rows="5"
                placeholder="What have you learned so far?"
            ></textarea>
        </div>

        <button type="submit" class="button">
            Create Entry
        </button>

    </form>

</section>

{% endblock %}

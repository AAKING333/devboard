{% extends "base.html" %}

{% block title %}
Edit Task | DevBoard
{% endblock %}

{% block content %}

<section class="form-container">

    <div class="page-header">
        <div>
            <h2>Edit Task</h2>
            <p>Update the task details.</p>
        </div>
    </div>

    <form method="POST" class="task-form">

        <div class="form-group">
            <label for="title">Title</label>

            <input
                type="text"
                id="title"
                name="title"
                value="{{ task['title'] }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="description">Description</label>

            <textarea
                id="description"
                name="description"
                rows="5"
            >{{ task["description"] or "" }}</textarea>
        </div>

        <div class="form-group">
            <label for="priority">Priority</label>

            <select id="priority" name="priority">

                <option
                    value="low"
                    {% if task["priority"] == "low" %}selected{% endif %}
                >
                    Low
                </option>

                <option
                    value="medium"
                    {% if task["priority"] == "medium" %}selected{% endif %}
                >
                    Medium
                </option>

                <option
                    value="high"
                    {% if task["priority"] == "high" %}selected{% endif %}
                >
                    High
                </option>

            </select>
        </div>

        <button type="submit" class="button">
            Save Changes
        </button>

    </form>

</section>

{% endblock %}

{% extends "base.html" %}

{% block title %}
New Note | DevBoard
{% endblock %}

{% block content %}

<section class="form-container">

    <div class="page-header">
        <div>
            <h2>New Note</h2>
            <p>Save something useful for later.</p>
        </div>
    </div>

    <form method="POST" class="note-form">

        <div class="form-group">
            <label for="title">Title</label>

            <input
                type="text"
                id="title"
                name="title"
                placeholder="e.g. Flask Blueprint Notes"
                required
            >
        </div>

        <div class="form-group">
            <label for="category">Category</label>

            <input
                type="text"
                id="category"
                name="category"
                placeholder="e.g. Flask"
            >
        </div>

        <div class="form-group">
            <label for="content">Content</label>

            <textarea
                id="content"
                name="content"
                rows="10"
                placeholder="Write your note..."
                required
            ></textarea>
        </div>

        <button type="submit" class="button">
            Create Note
        </button>

    </form>

</section>

{% endblock %}
